master:
  push:
    - name: docker-build-and-push-amd64

      services:
        - docker

      docker:
        image: docker:24-git

      env:
        # Codex CLI 版本。
        # latest：构建时安装 npm 上的最新版本。
        # 也可以固定版本，例如：0.101.0
        CODEX_VERSION: latest

      stages:
        - name: Build, Verify & Push Codex CLI (amd64)
          script: |
            set -euo pipefail

            echo "===== ENV CHECK ====="
            echo "CNB_DOCKER_REGISTRY=${CNB_DOCKER_REGISTRY:-}"
            echo "CNB_REPO_SLUG_LOWERCASE=${CNB_REPO_SLUG_LOWERCASE:-}"
            echo "CNB_COMMIT_SHORT=${CNB_COMMIT_SHORT:-}"
            echo "CNB_TAG=${CNB_TAG:-}"
            echo "CODEX_VERSION=${CODEX_VERSION:-latest}"
            echo "====================="

            # 检查 CNB 必需环境变量
            : "${CNB_DOCKER_REGISTRY:?CNB_DOCKER_REGISTRY is required}"
            : "${CNB_REPO_SLUG_LOWERCASE:?CNB_REPO_SLUG_LOWERCASE is required}"
            : "${CNB_TOKEN:?CNB_TOKEN is required}"

            # 最终镜像仓库地址，例如：
            # docker.cnb.cool/用户名/仓库名
            REGISTRY_IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"

            # 有 Git Tag 时使用 Tag，否则使用提交短哈希
            if [ -n "${CNB_TAG:-}" ]; then
              RAW_REF="${CNB_TAG}"
            else
              RAW_REF="${CNB_COMMIT_SHORT:-build}"
            fi

            # Docker Tag 不允许出现 /、空格等字符
            REF="$(
              printf '%s' "${RAW_REF}" |
              sed 's/[^A-Za-z0-9_.-]/-/g' |
              cut -c1-128
            )"

            if [ -z "${REF}" ]; then
              REF="build"
            fi

            IMAGE_LATEST="${REGISTRY_IMAGE}:latest"
            IMAGE_AMD64="${REGISTRY_IMAGE}:amd64"
            IMAGE_REF="${REGISTRY_IMAGE}:${REF}"

            echo "===== IMAGE TAGS ====="
            echo "IMAGE_LATEST=${IMAGE_LATEST}"
            echo "IMAGE_AMD64=${IMAGE_AMD64}"
            echo "IMAGE_REF=${IMAGE_REF}"
            echo "======================"

            echo "===== DOCKER INFO ====="
            docker version
            docker info

            echo "===== LOGIN CNB REGISTRY ====="

            printf '%s' "${CNB_TOKEN}" |
              docker login \
                "${CNB_DOCKER_REGISTRY}" \
                --username "${CNB_TOKEN_USER_NAME:-cnb}" \
                --password-stdin

            export DOCKER_BUILDKIT=1
            export BUILDKIT_PROGRESS=plain

            echo "===== BUILD AMD64 IMAGE ====="

            docker build \
              --pull \
              --platform linux/amd64 \
              --progress=plain \
              --build-arg "CODEX_VERSION=${CODEX_VERSION:-latest}" \
              --tag "${IMAGE_LATEST}" \
              --tag "${IMAGE_AMD64}" \
              --file Dockerfile \
              .

            echo "===== VERIFY IMAGE ====="

            docker image inspect "${IMAGE_REF}" \
              --format 'Image={{.RepoTags}} OS/Arch={{.Os}}/{{.Architecture}}'

            # 验证镜像中的 Codex CLI 可以正常运行
            docker run --rm "${IMAGE_REF}" --version

            echo "===== PUSH IMAGES ====="

            docker push "${IMAGE_LATEST}"
            docker push "${IMAGE_AMD64}"         

            echo "===== BUILD COMPLETE ====="
            echo "docker pull ${IMAGE_LATEST}"
            echo "docker pull ${IMAGE_AMD64}"